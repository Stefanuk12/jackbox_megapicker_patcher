[package]
name = "jackbox_megapicker_patcher"
description = "Patches the Jackbox Megapicker to support launching games installed in different directories, includes an ASAR integrity check bypass"
version = "0.1.0"
edition = "2024"

[dependencies]
asar_bypass = { path = "../asar_bypass" }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
once_cell = "1.21"
regex = "1.12"
serde_json = "1.0"
sha2 = "0.10"
steamworks = { version = "0.12", optional = true }
thiserror = "2.0"

[features]
default = ["steam-autodetect"]
# Auto-detect the Jackbox Megapicker install directory by querying Steam.
# Requires linking against libsteam_api.so at runtime, so it is disabled for
# the Nix build (where the install path is passed explicitly instead).
steam-autodetect = ["dep:steamworks"]
